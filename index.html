<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>LinkedIn Post Automation</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f3f6f8;
            min-height: 100vh;
        }

        .navbar {
            background: #0a66c2;
            color: white;
            padding: 18px 25px;
            font-size: 22px;
            font-weight: bold;
        }

        .container {
            width: 90%;
            max-width: 800px;
            margin: 40px auto;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
        }

        h1 {
            color: #222;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 25px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
        }

        textarea {
            width: 100%;
            min-height: 220px;
            padding: 15px;
            border: 1px solid #ccc;
            border-radius: 10px;
            resize: vertical;
            font-size: 16px;
            outline: none;
        }

        textarea:focus {
            border-color: #0a66c2;
        }

        .buttons {
            display: flex;
            gap: 12px;
            margin-top: 20px;
        }

        button {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        .preview {
            background: #e8f3ff;
            color: #0a66c2;
        }

        .linkedin {
            background: #0a66c2;
            color: white;
        }

        button:hover {
            opacity: 0.9;
        }

        .preview-box {
            display: none;
            margin-top: 25px;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 10px;
            background: #f9f9f9;
        }

        .preview-box h3 {
            margin-bottom: 10px;
            color: #222;
        }

        #previewText {
            white-space: pre-wrap;
            color: #444;
            line-height: 1.6;
        }

        @media (max-width: 600px) {
            .navbar {
                font-size: 18px;
                padding: 15px;
            }

            .container {
                width: 94%;
                margin: 25px auto;
            }

            .card {
                padding: 20px;
            }

            h1 {
                font-size: 24px;
            }

            .buttons {
                flex-direction: column;
            }

            button {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <div class="navbar">
        LinkedIn Post Automation
    </div>

    <div class="container">

        <div class="card">

            <h1>Create LinkedIn Post</h1>

            <p class="subtitle">
                Write, preview and publish your professional post.
            </p>

            <label for="post">Your Post</label>

            <textarea
                id="post"
                placeholder="Write your LinkedIn post here..."></textarea>

            <div class="buttons">

                <button class="preview" id="previewButton">
                    Preview Post
                </button>

                <button class="linkedin" onclick="window.location.href='/login'">
                    Connect LinkedIn
                </button>

            </div>

            <div class="preview-box" id="previewBox">

                <h3>Post Preview</h3>

                <p id="previewText"></p>

            </div>

        </div>

    </div>


    <script>

        const previewButton = document.getElementById("previewButton");

        const postBox = document.getElementById("post");

        const previewBox = document.getElementById("previewBox");

        const previewText = document.getElementById("previewText");


        previewButton.addEventListener("click", function () {

            const post = postBox.value.trim();

            if (post === "") {

                alert("Please write a post first!");

                return;
            }

            previewText.textContent = post;

            previewBox.style.display = "block";

        });

    </script>

</body>
</html>
